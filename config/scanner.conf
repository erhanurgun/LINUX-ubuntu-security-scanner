#!/bin/bash
# Security Scanner v2.0 Yapılandırma Dosyası
# ==========================================

# === TARAMA AYARLARI ===

# Paralel tarama (true/false)
SCAN_PARALLEL=false

# Paralel tarama thread sayısı
SCAN_THREADS=4

# Tarama zaman aşımı (saniye)
SCAN_TIMEOUT=300

# === MODÜL AYARLARI ===

# Etkin modüller (all veya virgülle ayrılmış liste)
# Örnek: "01-system-info,02-security-updates,05-network"
ENABLED_MODULES="all"

# Devre dışı modüller (virgülle ayrılmış liste)
# Örnek: "12-containers,13-compliance"
DISABLED_MODULES=""

# === RAPORLAMA ===

# Rapor formatları (virgülle ayrılmış: terminal, json, html, txt)
REPORT_FORMAT="terminal"

# Rapor saklama süresi (gün)
REPORT_RETENTION_DAYS=90

# Log saklama süresi (gün)
LOG_RETENTION_DAYS=30

# === BİLDİRİMLER ===

# Masaüstü bildirimleri (true/false)
NOTIFY_DESKTOP=true

# E-posta bildirimleri (true/false)
NOTIFY_EMAIL=false

# E-posta adresi
EMAIL_TO=""

# Webhook URL (Slack, Discord, vb.)
NOTIFY_WEBHOOK=""

# Hangi seviyelerde bildirim gönder
NOTIFY_ON_CRITICAL=true
NOTIFY_ON_HIGH=true
NOTIFY_ON_MEDIUM=false

# === FIM (File Integrity Monitoring) ===

# FIM aktif (true/false)
FIM_ENABLED=true

# İzlenecek dizinler (virgülle ayrılmış)
FIM_DIRECTORIES="/usr/bin,/usr/sbin,/etc"

# FIM'den hariç tutulacak pattern'ler
FIM_EXCLUDE="*.log,*.tmp,*.cache"

# === TARAMA FİLTRELERİ ===

# Minimum seviye (low, medium, high, critical)
MIN_SEVERITY="low"

# Kritik bulgu çıkış kodu
CRITICAL_EXIT_CODE=2

# Yüksek bulgu çıkış kodu
HIGH_EXIT_CODE=1

# === HARİÇ TUTULACAKLAR ===

# Hariç tutulacak dizinler (taramadan)
EXCLUDE_DIRS=(
    "node_modules"
    ".cache"
    ".local/share/Trash"
    "snap"
    ".npm"
    ".yarn"
)

# Güvenilir GNOME eklentileri (uyarı vermez)
TRUSTED_EXTENSIONS=(
    "ubuntu-dock@ubuntu.com"
    "ubuntu-appindicators@ubuntu.com"
    "tiling-assistant@ubuntu.com"
    "ding@rastersoft.com"
)

# === GELİŞMİŞ AYARLAR ===

# Debug modu (true/false)
DEBUG=false

# Verbose çıktı (true/false)
VERBOSE=false

# Renksiz çıktı (CI/CD için)
NO_COLOR=false
